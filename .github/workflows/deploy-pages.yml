name: Deploy Liên Hoa CRM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
  VITE_APPWRITE_PROJECT_ID: ${{ secrets.VITE_APPWRITE_PROJECT_ID }}
  VITE_APPWRITE_DATABASE_ID: ${{ secrets.VITE_APPWRITE_DATABASE_ID }}
  VITE_APPWRITE_PROFILES_TABLE_ID: ${{ secrets.VITE_APPWRITE_PROFILES_TABLE_ID }}
  VITE_APPWRITE_LEADS_TABLE_ID: ${{ secrets.VITE_APPWRITE_LEADS_TABLE_ID }}
  VITE_APPWRITE_FOLLOWUPS_TABLE_ID: ${{ secrets.VITE_APPWRITE_FOLLOWUPS_TABLE_ID }}
  VITE_APPWRITE_ACTIVITIES_TABLE_ID: ${{ secrets.VITE_APPWRITE_ACTIVITIES_TABLE_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Validate Appwrite configuration
        run: |
          test -n "$VITE_APPWRITE_PROJECT_ID"
          test -n "$VITE_APPWRITE_DATABASE_ID"
          test -n "$VITE_APPWRITE_PROFILES_TABLE_ID"
          test -n "$VITE_APPWRITE_LEADS_TABLE_ID"
          test -n "$VITE_APPWRITE_FOLLOWUPS_TABLE_ID"
          test -n "$VITE_APPWRITE_ACTIVITIES_TABLE_ID"
          echo "Appwrite configuration present."
      - name: Build CRM
        working-directory: frontend
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
