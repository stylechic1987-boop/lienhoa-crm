name: Deploy Liên Hoa CRM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ivbnnubqeafjkqoeovmk.supabase.co
  # Supabase publishable keys are designed for browser applications.
  # Keep this in the build environment so the deployed frontend always uses the active project key.
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable__42rr9VIa5GXDD3Dw8oOuQ_OzS6DGCp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Validate Supabase configuration
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          echo "Supabase publishable key configured."
      - name: Build CRM
        working-directory: frontend
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
